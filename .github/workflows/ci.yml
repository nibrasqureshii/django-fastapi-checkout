name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_checkout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ticket_checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r shop/requirements.txt -r gateway/requirements.txt -r requirements-dev.txt
      - name: Gateway tests (FastAPI)
        working-directory: gateway
        run: python -m pytest -q
      - name: Shop tests (Django, Postgres)
        working-directory: shop
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings_test
          python -m pytest -q
